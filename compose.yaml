services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://admin:symbiote_db_roar_2026@db:27017/venom_portfolio?authSource=admin
      - ADMIN_EMAIL=admin@venom.dev
      - ADMIN_PASSWORD=symbiote_roar_2026
      - NEXTAUTH_SECRET=9f1f0a82b9a7c3d2e1f0b2a3c4d5e6f7a8b9c0d1e2f3
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=symbiote_db_roar_2026
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mongodb_data:
    driver: local
